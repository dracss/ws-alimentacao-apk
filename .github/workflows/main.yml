name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.1"

      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compilar APK
        run: yes | buildozer android debug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: WS-Alimentacao-APK
          path: bin/*.apk

      - name: Publicar Release com link do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WS Alimentacao - APK
          body: APK do app WS Alimentacao.
          files: bin/*.apk
